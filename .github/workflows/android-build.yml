# Android 디버그 APK 자동 빌드.
# PR과 main 푸시마다 데이터 검증 → 세이브 테스트 → APK 내보내기를 실행하고,
# 결과 APK를 워크플로 아티팩트로 올린다(Actions 탭에서 내려받아 기기에 설치).
name: Android 빌드

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 에디터와 Android 템플릿은 버전별로 캐시한다(템플릿 묶음이 1.2GB라 매번 받으면 느리다).
      - name: Godot 캐시
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-android

      - name: Godot 에디터와 Android 템플릿 설치
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -qj /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d "$dest"

      - name: 에디터 설정(Android SDK, 디버그 키)
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          CFG
          # CI 전용 임시 디버그 키(실행마다 새로 생성, 릴리스 서명과 무관)
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: 리소스 임포트
        run: timeout 300 ~/godot/godot --headless --path . --import || true

      - name: 데이터 검증
        run: ~/godot/godot --headless --path . --script res://tools/validate_data.gd

      - name: 세이브 시스템 테스트
        run: ~/godot/godot --headless --path . --script res://tests/test_save_system.gd

      - name: Android 디버그 APK 내보내기
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p builds/android
          ~/godot/godot --headless --path . --export-debug "Android" builds/android/imugi-debug.apk
          test -s builds/android/imugi-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: imugi-debug-apk
          path: builds/android/imugi-debug.apk
          retention-days: 14
